[Processor]
Name=Template
Description=A skeleton scanner processor - copy me
Author=your name
Version=1.0.0
Exec=bin/{key}/proc_template
; games-folder: the whole Games tree, once, before every scan (see src/main.cpp's startGames()).
; rom: one ROM at a time, --ismine first (src/main.cpp's isMine()) then --start --rom.
Kinds=games-folder
; the extension(s) this processor claims - keep in sync with src/main.cpp's Extensions
Match=*.example
; comma-separated system names this applies to (rom kind only); empty = every system
Systems=
Order=10
; say something at least this often (fsutil::Heartbeat in src/main.cpp) or the launcher assumes you hung
Timeout=120
; true if this processor changes/removes/adds files under the games dir (most do)
Modifies=true
